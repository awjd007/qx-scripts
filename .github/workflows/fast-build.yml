name: Fast Tweak Build

# 极速构建：只编译一次默认方案（arm64+arm64e fat dylib），
# 跳过 rootless/roothide deb、跳过 APT 索引、跳过 release 发布。
# 目的：迭代调试时把等待时间从 ~5 分钟压到 ~1.5 分钟。
#
# 触发方式：
#   - push 到 lovekey-tweak/ 自动触发
#   - 或在 Actions 页面手动 Run workflow
# 产物：dist/lovekey-tweak/LovekeyTweak.dylib（同时上传为 artifact）

on:
  workflow_dispatch:
  push:
    paths:
      - 'lovekey-tweak/**'

# 与 build-lovekey-tweak.yml 同时监听 lovekey-tweak/** 会并行触发，
# 两者都会向 dist/ 写 LovekeyTweak.dylib，后完成的覆盖前面的，产物不可控。
# 这里用 concurrency 让 fast-build 取消同分支上仍在跑的旧 run，
# 并确保它最终写入的是本次改动对应的产物。
concurrency:
  group: lovekey-tweak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # theos-action 自带缓存，比手动 git clone --recursive 快得多
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build dylib
        run: |
          cd lovekey-tweak
          make clean || true
          set +e
          make package FINALPACKAGE=1 > /tmp/build.log 2>&1
          RC=$?
          echo "---- 编译日志末尾 ----"
          tail -60 /tmp/build.log
          echo "---- 结束 ----"
          if [ $RC -ne 0 ]; then
            # 把完整日志落盘并提交，便于在无法查看 Actions 日志时定位
            mkdir -p ../dist
            cp /tmp/build.log ../dist/build-log.txt
            echo "::error::编译失败(rc=$RC)，完整日志已写入 dist/build-log.txt"
            exit 1
          fi
          # 成功后也留一份精简日志，便于确认实际编译了哪些文件
          mkdir -p ../dist
          grep -E "Compiling|Linking|error:|warning: unused" /tmp/build.log | tail -40 > ../dist/build-log.txt || true
          if [ ! -s ../dist/build-log.txt ]; then echo "(无编译行，写入完整日志)" > ../dist/build-log.txt; tail -40 /tmp/build.log >> ../dist/build-log.txt; fi
          mkdir -p /tmp/out
          find .theos -name '*.dylib' -exec cp {} /tmp/out/ \;
          echo "--- 产物 ---"
          ls -la /tmp/out/

      - name: Verify
        run: |
          DY=$(ls /tmp/out/*.dylib | head -1)
          if [ -z "$DY" ]; then echo "::error::没有找到 dylib"; exit 1; fi
          ls -la "$DY"
          # 确认新代码真的编进去了
          for s in "protocolClasses" "LovekeyTweak"; do
            if strings "$DY" | grep -q "$s"; then
              echo "OK: $s"
            else
              echo "::error::dylib 缺少 [$s]"
              exit 1
            fi
          done
          if otool -L "$DY" | grep -qiE 'substrate|libhooker|ellekit'; then
            echo "::error::依赖 hook 运行时"
            exit 1
          fi
          echo "校验通过"

      - name: Publish to dist
        if: always()
        run: |
          mkdir -p dist/lovekey-tweak
          cp /tmp/out/*.dylib dist/lovekey-tweak/ 2>/dev/null || true
          ls -la dist/lovekey-tweak/ || true

      - name: Commit dist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/lovekey-tweak/LovekeyTweak.dylib 2>/dev/null || true
          git add -f dist/build-log.txt 2>/dev/null || true
          git commit -m "ci: fast build [skip ci]" || true
          git pull --rebase origin main || true
          git push || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LovekeyTweak-fast
          path: /tmp/out/*.dylib
          if-no-files-found: warn
          retention-days: 3
