name: Build LovekeyTweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'lovekey-tweak/**'
      - '.github/workflows/build-lovekey-tweak.yml'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build packages
        run: |
          set -x
          cd lovekey-tweak
          # 默认方案必须编译成功，失败即中断（不再用 || true 吞错误）
          make clean
          make package FINALPACKAGE=1
          mkdir -p /tmp/dylib-out
          find .theos -name '*.dylib' -exec cp {} /tmp/dylib-out/ \;
          echo "--- dylib-out ---"
          ls -la /tmp/dylib-out/
          # 可选方案允许失败
          make clean || true
          make package SCHEME=rootless FINALPACKAGE=1 || true
          make clean || true
          make package SCHEME=roothide FINALPACKAGE=1 || true
          echo "--- packages ---"
          ls -la packages/ || true

      - name: Verify build content
        run: |
          DY=$(ls /tmp/dylib-out/*.dylib | head -1)
          echo "检查 $DY"
          ls -la "$DY"
          # 确认新代码真的编进去了
          for s in "protocolClasses 挂钩成功" "LovekeyTweak 启动"; do
            if strings "$DY" | grep -q "$s"; then
              echo "OK: 找到 [$s]"
            else
              echo "::error::dylib 缺少日志字符串 [$s]，编译产物是旧的"
              exit 1
            fi
          done
          echo "=== 依赖列表 ==="
          otool -L "$DY"
          if otool -L "$DY" | grep -qiE 'substrate|libhooker|ellekit'; then
            echo "::error::dylib 依赖 hook 运行时，TrollFools 会加载失败"
            exit 1
          fi
          echo "依赖检查通过：无 hook 运行时依赖"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LovekeyTweak
          path: |
            lovekey-tweak/packages/*.deb
            /tmp/dylib-out/*.dylib
          if-no-files-found: warn

      - name: Publish debs to dist
        if: always()
        run: |
          mkdir -p dist/lovekey-tweak
          cp lovekey-tweak/packages/*.deb dist/lovekey-tweak/ 2>/dev/null || true
          cp /tmp/dylib-out/*.dylib dist/lovekey-tweak/ 2>/dev/null || true
          ls -la dist/lovekey-tweak/ || true

      - name: Commit dist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/lovekey-tweak
          git commit -m "ci: publish lovekey-tweak builds [skip ci]" || true
          git pull --rebase origin main || true
          git push || true

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tweak-latest
          name: LovekeyTweak latest
          body: |
            自动构建产物。
            - `LovekeyTweak.dylib` → TrollFools 注入用
            - `*.deb` → 越狱安装
          files: |
            /tmp/dylib-out/*.dylib
            lovekey-tweak/packages/*.deb
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
