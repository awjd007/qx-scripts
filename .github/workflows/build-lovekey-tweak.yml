name: Build LovekeyTweak

on:
  workflow_dispatch:
  push:
    paths:
      - 'lovekey-tweak/**'
      - '.github/workflows/build-lovekey-tweak.yml'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Build packages
        run: |
          set -x
          cd lovekey-tweak
          make clean || true
          make package FINALPACKAGE=1 || true
          # 留存默认方案的 dylib，便于 TrollFools 直接注入
          mkdir -p /tmp/dylib-out
          find .theos -name '*.dylib' -exec cp {} /tmp/dylib-out/ \; || true
          make clean || true
          make package SCHEME=rootless FINALPACKAGE=1 || true
          make clean || true
          make package SCHEME=roothide FINALPACKAGE=1 || true
          echo "--- packages ---"
          ls -la packages/ || true

      - name: Verify dylib dependencies
        if: always()
        run: |
          echo "=== 依赖列表（关键：不能出现 substrate）==="
          for f in /tmp/dylib-out/*.dylib; do
            echo "--- $f ---"
            otool -L "$f" || true
            otool -l "$f" | grep -A4 LC_BUILD_VERSION || true
          done
          # 硬性校验：出现 substrate/libhooker 即视为 TrollFools 不兼容
          if otool -L /tmp/dylib-out/*.dylib 2>/dev/null | grep -qiE 'substrate|libhooker|ellekit'; then
            echo "::error::dylib 仍依赖 hook 运行时，TrollFools 环境会加载失败"
            exit 1
          fi
          echo "依赖检查通过：无 hook 运行时依赖"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LovekeyTweak
          path: |
            lovekey-tweak/packages/*.deb
            /tmp/dylib-out/*.dylib
          if-no-files-found: warn

      - name: Publish debs to dist
        if: always()
        run: |
          mkdir -p dist/lovekey-tweak
          cp lovekey-tweak/packages/*.deb dist/lovekey-tweak/ 2>/dev/null || true
          cp /tmp/dylib-out/*.dylib dist/lovekey-tweak/ 2>/dev/null || true
          ls -la dist/lovekey-tweak/ || true

      - name: Commit dist
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/lovekey-tweak
          git commit -m "ci: publish lovekey-tweak builds [skip ci]" || true
          git push || true
